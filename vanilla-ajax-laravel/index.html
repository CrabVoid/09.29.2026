<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React 18 + Laravel REST API (CRUD Dashboard)</title>

    <!-- =========================================================================
         1. STYLING: Bootstrap 5 CSS & Bootstrap Icons via CDN
         ========================================================================= -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .hero { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; padding: 2.5rem 0; }
        .card { transition: transform 0.2s ease, box-shadow 0.2s ease; border-radius: 0.75rem; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .badge-status { width: 8px; height: 8px; display: inline-block; border-radius: 50%; }
        .badge-online { background-color: #22c55e; }
        .badge-offline { background-color: #ef4444; }
    </style>

    <!-- =========================================================================
         2. REACT FRAMEWORK & BABEL (JSX COMPILER)
         - react.production.min.js: Core React engine (hooks, components, virtual DOM).
         - react-dom.production.min.js: Renders React components into the actual browser DOM.
         - babel.min.js: Transpiles modern JSX syntax directly inside the browser.
         ========================================================================= -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Bootstrap Bundle JS for Modal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <!-- Target mount container where React injects the entire component tree -->
    <div id="root"></div>

    <!-- =========================================================================
         3. REACT APPLICATION SCRIPT (JSX)
         ========================================================================= -->
    <script type="text/babel">
        /**
         * =========================================================================
         * REACT PROGRAMMING CONCEPTS USED:
         *
         * 1. Declarative UI vs Imperative DOM Manipulation:
         *    - Vanilla JS: You manually create elements (createElement), set innerHTML, and appendChild.
         *    - React: You declare *what* the UI should look like based on current State.
         *      When State changes, React automatically updates only the parts of the DOM that changed.
         *
         * 2. React Hooks:
         *    - `useState`: Manages dynamic component data (posts, loading state, modal inputs).
         *    - `useEffect`: Handles side-effects (e.g., fetching data from Laravel API on component mount).
         *    - `useRef`: Retains a mutable reference across renders (used here to hold the Bootstrap Modal instance).
         *
         * 3. Component Hierarchy & Props:
         *    - Modular functional components (`Navbar`, `PostCard`, `PostModal`, `AlertBanner`).
         *    - Passing data down and event callbacks up via props.
         *
         * 4. Virtual DOM:
         *    React keeps an in-memory representation of UI to minimize slow direct DOM reflows.
         * =========================================================================
         */

        const { useState, useEffect, useRef } = React;
        const API_URL = "http://127.0.0.1:8000/api/posts";

        // =========================================================================
        // COMPONENT: App (Root / Main Controller Component)
        // =========================================================================
        function App() {
            // STATE: List of posts fetched from Laravel database
            const [posts, setPosts] = useState([]);
            
            // STATE: Loading spinner toggle
            const [loading, setLoading] = useState(false);
            
            // STATE: API online/offline indicator
            const [apiConnected, setApiConnected] = useState(false);
            
            // STATE: Alert notifications { message: "...", type: "success" | "danger" }
            const [alert, setAlert] = useState(null);

            // STATE: Current post being edited or created
            const [modalData, setModalData] = useState({ id: null, title: "", body: "" });
            
            // STATE: Save button loading state
            const [saving, setSaving] = useState(false);

            // REF: Bootstrap modal DOM node & instance
            const modalRef = useRef(null);
            const bsModalInstance = useRef(null);

            // Initialize Bootstrap modal instance once on mount
            useEffect(() => {
                if (modalRef.current) {
                    bsModalInstance.current = new bootstrap.Modal(modalRef.current);
                }
                loadPosts(); // Initial fetch
            }, []);

            // Helper: Display temporary feedback notification
            const showAlert = (message, type = "danger") => {
                setAlert({ message, type });
                setTimeout(() => setAlert(null), 4000);
            };

            // =====================================================================
            // CRUD OPERATION: READ (GET /api/posts)
            // =====================================================================
            const loadPosts = async () => {
                setLoading(true);
                try {
                    const response = await fetch(API_URL, {
                        method: "GET",
                        headers: { "Accept": "application/json" }
                    });
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const data = await response.json();
                    setPosts(Array.isArray(data) ? data : []);
                    setApiConnected(true);
                } catch (error) {
                    console.error("Fetch Error:", error);
                    setApiConnected(false);
                    showAlert(`Failed to fetch posts: ${error.message}`, "danger");
                } finally {
                    setLoading(false);
                }
            };

            // =====================================================================
            // CRUD OPERATION: CREATE & UPDATE (POST / PUT)
            // =====================================================================
            const handleSavePost = async (e) => {
                e.preventDefault();
                if (!modalData.title.trim() || !modalData.body.trim()) {
                    alert("Please fill out both Title and Content fields.");
                    return;
                }

                setSaving(true);
                const isEditing = Boolean(modalData.id);
                const url = isEditing ? `${API_URL}/${modalData.id}` : API_URL;
                const method = isEditing ? "PUT" : "POST";

                try {
                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify({
                            title: modalData.title.trim(),
                            body: modalData.body.trim()
                        })
                    });

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    // Hide modal & reload list
                    if (bsModalInstance.current) bsModalInstance.current.hide();
                    showAlert(isEditing ? "Post updated successfully!" : "Post created successfully!", "success");
                    loadPosts();
                } catch (error) {
                    console.error("Save Error:", error);
                    showAlert(`Failed to save post: ${error.message}`, "danger");
                } finally {
                    setSaving(false);
                }
            };

            // =====================================================================
            // CRUD OPERATION: DELETE (DELETE /api/posts/{id})
            // =====================================================================
            const handleDeletePost = async (id) => {
                if (!confirm(`Are you sure you want to delete post #${id}?`)) return;

                try {
                    const response = await fetch(`${API_URL}/${id}`, {
                        method: "DELETE",
                        headers: { "Accept": "application/json" }
                    });

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    showAlert(`Post #${id} deleted successfully.`, "success");
                    loadPosts();
                } catch (error) {
                    console.error("Delete Error:", error);
                    showAlert(`Failed to delete: ${error.message}`, "danger");
                }
            };

            // Modal openers: Preparing React state for Create vs Edit
            const openCreateModal = () => {
                setModalData({ id: null, title: "", body: "" });
                if (bsModalInstance.current) bsModalInstance.current.show();
            };

            const openEditModal = (post) => {
                setModalData({ id: post.id, title: post.title || "", body: post.body || "" });
                if (bsModalInstance.current) bsModalInstance.current.show();
            };

            return (
                <div>
                    {/* Header Component */}
                    <header className="hero shadow-sm">
                        <div className="container d-flex flex-wrap justify-content-between align-items-center gap-3">
                            <div>
                                <h1 className="h3 fw-bold mb-1">
                                    <i className="bi bi-code-slash me-2"></i>React 18 + Laravel CRUD
                                </h1>
                                <p className="mb-0 opacity-75 small">
                                    Declarative UI with React State, Hooks &amp; Laravel MySQL REST API
                                </p>
                            </div>
                            <div className="d-flex align-items-center gap-2">
                                <span className="badge bg-dark bg-opacity-50 px-3 py-2 text-white">
                                    <span className={`badge-status ${apiConnected ? "badge-online" : "badge-offline"} me-1`}></span>
                                    <span>{apiConnected ? "API Connected (MySQL)" : "API Disconnected"}</span>
                                </span>
                                <button className="btn btn-light fw-semibold shadow-sm" onClick={loadPosts} disabled={loading}>
                                    <i className="bi bi-arrow-clockwise me-1"></i> Refresh
                                </button>
                                <button className="btn btn-warning fw-semibold shadow-sm" onClick={openCreateModal}>
                                    <i className="bi bi-plus-lg me-1"></i> New Post
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main className="container my-4">
                        {/* Alert Banner */}
                        {alert && (
                            <div className={`alert alert-${alert.type} shadow-sm`} role="alert">
                                {alert.message}
                            </div>
                        )}

                        {/* Loading Spinner */}
                        {loading && (
                            <div className="text-center my-5">
                                <div className="spinner-border text-primary" role="status">
                                    <span className="visually-hidden">Loading...</span>
                                </div>
                                <p className="text-muted mt-2">Connecting to API...</p>
                            </div>
                        )}

                        {/* Posts Grid */}
                        {!loading && posts.length === 0 ? (
                            <div className="text-center py-5 text-muted">
                                <i className="bi bi-folder2-open display-4 d-block mb-2"></i>
                                <h5>No posts found in database</h5>
                                <p>Click <strong>"New Post"</strong> above to create your first item.</p>
                            </div>
                        ) : (
                            <div className="row g-3">
                                {posts.map(post => (
                                    <div key={post.id} className="col-md-6 col-lg-4">
                                        <div className="card h-100 border-0 shadow-sm p-3">
                                            <div className="d-flex justify-content-between align-items-start mb-2">
                                                <span className="badge bg-primary bg-opacity-10 text-primary fw-semibold">
                                                    #{post.id}
                                                </span>
                                                <small className="text-muted">
                                                    {post.created_at ? new Date(post.created_at).toLocaleDateString() : ""}
                                                </small>
                                            </div>
                                            <h5 className="card-title fw-bold text-dark">{post.title || "Untitled"}</h5>
                                            <p className="card-text text-secondary flex-grow-1">{post.body || "(no content)"}</p>
                                            <div className="d-flex justify-content-end gap-2 border-top pt-3 mt-2">
                                                <button 
                                                    className="btn btn-sm btn-outline-primary"
                                                    onClick={() => openEditModal(post)}
                                                >
                                                    <i className="bi bi-pencil me-1"></i>Edit
                                                </button>
                                                <button 
                                                    className="btn btn-sm btn-outline-danger"
                                                    onClick={() => handleDeletePost(post.id)}
                                                >
                                                    <i className="bi bi-trash me-1"></i>Delete
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Reusable Bootstrap Modal for Create / Edit Form */}
                    <div className="modal fade" id="postModal" ref={modalRef} tabIndex="-1" aria-hidden="true">
                        <div className="modal-dialog">
                            <div className="modal-content border-0 shadow">
                                <div className="modal-header bg-primary text-white">
                                    <h5 className="modal-title">
                                        {modalData.id ? `Edit Post #${modalData.id}` : "Create New Post"}
                                    </h5>
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                </div>
                                <form onSubmit={handleSavePost}>
                                    <div className="modal-body">
                                        <div className="mb-3">
                                            <label className="form-label fw-semibold">Title</label>
                                            <input 
                                                type="text" 
                                                className="form-control" 
                                                placeholder="e.g. React + Laravel"
                                                value={modalData.title}
                                                onChange={(e) => setModalData({ ...modalData, title: e.target.value })}
                                                required 
                                            />
                                        </div>
                                        <div className="mb-3">
                                            <label className="form-label fw-semibold">Content</label>
                                            <textarea 
                                                className="form-control" 
                                                rows="4" 
                                                placeholder="Write post body here..."
                                                value={modalData.body}
                                                onChange={(e) => setModalData({ ...modalData, body: e.target.value })}
                                                required 
                                            ></textarea>
                                        </div>
                                    </div>
                                    <div className="modal-footer">
                                        <button type="button" className="btn btn-secondary" data-bs-dismiss="modal">
                                            Cancel
                                        </button>
                                        <button type="submit" className="btn btn-primary px-4" disabled={saving}>
                                            {saving ? "Saving..." : "Save Post"}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Mount the React Application to the #root DOM element
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>

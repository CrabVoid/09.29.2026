<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React 18 + Laravel REST API (CRUD Dashboard)</title>

    <!-- =========================================================================
         1. STYLING: Bootstrap 5 CSS & Bootstrap Icons via CDN
         ========================================================================= -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">

    <!-- =========================================================================
         2. REACT FRAMEWORK & BABEL (JSX COMPILER)
         - react.production.min.js: Core React engine (hooks, components, virtual DOM).
         - react-dom.production.min.js: Renders React components into the actual browser DOM.
         - babel.min.js: Transpiles modern JSX syntax directly inside the browser.
         ========================================================================= -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Bootstrap Bundle JS for Modal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="app.js"></script>
</body>
</html>
